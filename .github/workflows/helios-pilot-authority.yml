name: HELIOS Pilot Authority

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: helios-pilot-authority
  cancel-in-progress: false

jobs:
  pilot-authority:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Critical licensing syntax and invariant preflight
        run: |
          npm run check:public
          node tests/pilot-authority-invariants.test.mjs
          node tests/claim-implementation-audit-invariants.test.mjs
          npm run audit:secrets
          npm run audit:preflight:strict

      - name: Live read-only Ethereum RPC quorum preflight
        run: node tools/pilot-rpc-smoke.mjs

      - name: Verify or issue standard pilot grants
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pilot-payment-watch.mjs
