name: HELIOS Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Syntax / public surface checks
        run: npm run check:public

      - name: Invariant test suite
        run: npm test

      - name: High-confidence secret scan
        run: npm run audit:secrets

      - name: Buyer due-diligence preflight
        run: npm run audit:preflight

      - name: Generate strict closing manifest candidate
        run: npm run closing:manifest
