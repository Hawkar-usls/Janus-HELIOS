name: HELIOS Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Syntax / public surface checks
        run: npm run check:public

      - name: Invariant test suite
        run: npm test

      - name: High-confidence secret scan
        run: npm run audit:secrets

      - name: Buyer due-diligence preflight
        run: npm run audit:preflight

      - name: Generate strict closing manifest candidate
        run: npm run closing:manifest
